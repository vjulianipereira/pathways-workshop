<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workshop Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Workshop Dashboard</h1>

        <h2>Workshop Stage</h2>

        <p id="currentStage">
            Loading...
        </p>
        
        <div class="button-row">
        
            <button id="scoringBtn">
                Start Scoring
            </button>
        
            <button id="weightingBtn">
                Start Weighting
            </button>
        
            <button id="completeBtn">
                Complete Workshop
            </button>
        
        </div>

        <h2 id="counter">
            Loading...
        </h2>

        <div id="unweightedSection">

            <h2>
                Unweighted Pathway Scoring
            </h2>
        
            <div id="unweightedChart"></div>
        
        </div>

        <div id="weightedSection">
        
            <h2>
                Weighted Pathway Comparison
            </h2>
        
            <div id="resultsChart"></div>
        
        </div>

        <div id="weightsSection">
        
            <h2>
                Average Criterion Importance
            </h2>
        
            <div id="weightsChart"></div>
        
        </div>

        <div id="uncertaintySection">
        
            <h2>
                Pathway Uncertainty
            </h2>
        
            <div id="uncertaintyChart"></div>
        
        </div>

        <div id="comparisonSection">
        
            <h2>
                Weighted Pathway Comparison
            </h2>
        
            <div id="comparisonChart"></div>
        
        </div>

        <div id="consensusSection">
        
            <h2>
                Consensus Analysis
            </h2>
        
            <div id="consensusChart"></div>
        
        </div>

        <div id="profilesSection">
        
            <h2>
                Pathway Profiles
            </h2>
        
            <div id="robustnessChart"></div>
        
        </div>
        
        <p id="updated"></p>

        <p id="status">
            Auto-refresh every 30 seconds
        </p>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
