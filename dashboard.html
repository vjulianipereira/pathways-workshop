<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workshop Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Workshop Dashboard</h1>

        <h2 id="counter">
            Loading...
        </h2>

        <h2>Pathway Summary</h2>

        <div class="dashboard-scale">

            <span>0</span>
            <span>25</span>
            <span>50</span>
            <span>75</span>
            <span>100</span>

        </div>

        <h2>
            Average Weighted Pathway Scores
        </h2>

        <div id="resultsChart"></div>

        <p id="updated"></p>

        <p id="status">
            Auto-refresh every 30 seconds
        </p>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
