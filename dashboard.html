<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workshop Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Workshop Dashboard</h1>

        <h2>Workshop Stage</h2>

        <p id="currentStage">
            Loading...
        </p>
        
        <div class="button-row">
        
            <button id="scoringBtn">
                Start Scoring
            </button>
        
            <button id="weightingBtn">
                Start Weighting
            </button>
        
            <button id="completeBtn">
                Complete Workshop
            </button>
        
        </div>

        <h2 id="counter">
            Loading...
        </h2>

<div class="dashboard-grid">

    <div
        id="unweightedSection"
        class="dashboard-panel">
    
        <h2>
            Unweighted Pathway Scoring
        </h2>
    
        <div class="figure-shell pathway-figure">
    
            <div class="figure-grid figure-grid-100"></div>
    
            <div
                id="unweightedChart"
                class="figure-content">
            </div>
    
        </div>
    
        <div class="figure-axis">
    
            <div class="figure-axis-spacer"></div>
    
            <div class="axis-values axis-values-100">
                <span>0</span>
                <span>10</span>
                <span>20</span>
                <span>30</span>
                <span>40</span>
                <span>50</span>
                <span>60</span>
                <span>70</span>
                <span>80</span>
                <span>90</span>
                <span>100</span>
            </div>
    
        </div>
    
    </div>

        <div
        id="comparisonSection"
        class="dashboard-panel">
    
        <h2>
            Weighted Pathway Comparison
        </h2>
    
        <div class="figure-shell pathway-figure">
    
            <div class="figure-grid figure-grid-100"></div>
    
            <div
                id="comparisonChart"
                class="figure-content">
            </div>
    
        </div>
    
        <div class="figure-axis">
    
            <div class="figure-axis-spacer"></div>
    
            <div class="axis-values axis-values-100">
                <span>0</span>
                <span>10</span>
                <span>20</span>
                <span>30</span>
                <span>40</span>
                <span>50</span>
                <span>60</span>
                <span>70</span>
                <span>80</span>
                <span>90</span>
                <span>100</span>
            </div>
    
        </div>
    
    </div>
    
    <div
        id="weightsSection"
        class="dashboard-panel">

        <h2>
            Average Criterion Importance
        </h2>

        <div id="weightsChart"></div>

    </div>

    <div
        id="consensusSection"
        class="dashboard-panel">

        <h2>
            Consensus Analysis
        </h2>

        <div id="consensusChart"></div>

    </div>

</div>
        
        <p id="updated"></p>

        <p id="status">
            Auto-refresh every 30 seconds
        </p>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
