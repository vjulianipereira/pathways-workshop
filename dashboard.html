<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workshop Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Workshop Dashboard</h1>

        <h2>Workshop Stage</h2>

        <p id="currentStage">
            Loading...
        </p>
        
        <div class="button-row">
        
            <button id="scoringBtn">
                Start Scoring
            </button>
        
            <button id="weightingBtn">
                Start Weighting
            </button>
        
            <button id="completeBtn">
                Complete Workshop
            </button>
        
        </div>

        <h2 id="counter">
            Loading...
        </h2>

        <h2>
            Average Weighted Pathway Scores
        </h2>

        <div id="resultsChart"></div>

        <h2>
            Average Criterion Importance
        </h2>
        
        <div id="weightsChart"></div>

        <h2>
            Pathway Uncertainty
        </h2>
        
        <div id="uncertaintyChart"></div>

        <h2>
            Pathway Comparison
        </h2>
        
        <div id="comparisonChart"></div>

        <h2>
            Consensus Analysis
        </h2>
        
        <div id="consensusChart"></div>

        <h2>
            Pathway Profiles
        </h2>
        
        <div id="robustnessChart"></div>
        
        <p id="updated"></p>

        <p id="status">
            Auto-refresh every 30 seconds
        </p>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
