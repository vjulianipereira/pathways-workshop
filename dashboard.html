<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Workshop Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Workshop Dashboard</h1>

        <h2>Workshop Stage</h2>

        <p id="currentStage">
            Loading...
        </p>
        
        <div class="button-row">
        
            <button id="scoringBtn">
                Start Scoring
            </button>
        
            <button id="weightingBtn">
                Start Weighting
            </button>
        
            <button id="completeBtn">
                Complete Workshop
            </button>
        
        </div>

        <div class="button-row">

            <button id="presentationBtn">
                Toggle Presentation Mode
            </button>
        
        </div>

        <h2 id="counter">
            Loading...
        </h2>

<div class="dashboard-grid">

    <div
        id="unweightedSection"
        class="dashboard-panel">

        <h2>
            Unweighted Pathway Scoring
        </h2>

        <div id="unweightedChart"></div>

        <div class="chart-scale">

            <span>0</span>
        
            <span>25</span>
        
            <span>50</span>
        
            <span>75</span>
        
            <span>100</span>
        
        </div>

    </div>

    <div
        id="comparisonSection"
        class="dashboard-panel">

        <h2>
            Weighted Pathway Comparison
        </h2>

        <div id="comparisonChart"></div>

        <div class="chart-scale">

            <span>0</span>
        
            <span>25</span>
        
            <span>50</span>
        
            <span>75</span>
        
            <span>100</span>
        
        </div>

    </div>

    <div
        id="weightsSection"
        class="dashboard-panel">

        <h2>
            Average Criterion Importance
        </h2>

        <div id="weightsChart"></div>

        <div class="chart-scale">

            <span>0</span>
        
            <span>1</span>
        
            <span>2</span>
        
            <span>3</span>
        
            <span>4</span>
        
            <span>5</span>
        
        </div>

    </div>

    <div
        id="consensusSection"
        class="dashboard-panel">

        <h2>
            Consensus Analysis
        </h2>

        <div id="consensusChart"></div>

    </div>

</div>

<!--    <div id="weightedSection">
        
            <h2>
                Weighted Pathway Comparison
            </h2>
        
            <div id="resultsChart"></div>
        
        </div>


        <div id="uncertaintySection">
        
            <h2>
                Pathway Uncertainty
            </h2>
        
            <div id="uncertaintyChart"></div>
        
        </div>
        

        <div id="profilesSection">
        
            <h2>
                Pathway Profiles
            </h2>
        
            <div id="robustnessChart"></div>
        
        </div>
-->
        
        <p id="updated"></p>

        <p id="status">
            Auto-refresh every 30 seconds
        </p>

        <button id="refreshBtn">
            Refresh
        </button>

    </div>

    <script src="dashboard.js"></script>

</body>

</html>
